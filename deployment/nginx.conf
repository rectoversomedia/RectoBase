# =============================================================================
# RectoBase Nginx Configuration Template
# =============================================================================
# Deployment: salin ke /etc/nginx/sites-available/rectobase
# Aktifkan: ln -sf /etc/nginx/sites-available/rectobase /etc/nginx/sites-enabled/
# Reload: nginx -s reload
# =============================================================================

# ─── Rate Limiting Zones ────────────────────────────────────────────────────
# Zone untuk auth endpoints - sangat ketat (5 request per menit)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

# Zone untuk API umum (100 request per menit)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;

# Zone untuk koneksi simultan
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ─── HTTP Server Block ───────────────────────────────────────────────────────
# Redirect semua HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Security headers dasar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block access ke file sensitif
    location ~ /\. {
        deny all;
    }

    # Redirect ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt ACME challenge
    location ~ ^/\.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }
}

# ─── HTTPS Server Block ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # ─── SSL Configuration ────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # SSL modern config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL session
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_max_length 10240;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/xhtml+xml
        application/ld+json
        application/manifest+json;

    # ─── Connection Limiting ───────────────────────────────────────────────
    limit_conn addr 100;

    # ─── Server Tokens ─────────────────────────────────────────────────────
    server_tokens off;

    # ─── Static Files Root ─────────────────────────────────────────────────
    root /var/www/rectobase/frontend;
    index index.html;

    # ─── Main Application Routes ───────────────────────────────────────────
    location / {
        # SPA fallback - coba file fisik, fallback ke index.html
        try_files $uri $uri/ /index.html;

        # Cache control untuk static assets
        location ~* \.(ico|png|jpg|jpeg|gif|css|js|svg|woff|woff2|ttf|eot|otf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ─── API Proxy ─────────────────────────────────────────────────────────
    location /api/ {
        # Rate limiting: 100 req/min dengan burst 20
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # Proxy ke backend Node.js
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers untuk WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy buffering off untuk streaming
        proxy_buffering off;
        proxy_cache off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for SSE/long-polling
        proxy_request_buffering off;
    }

    # ─── Auth Rate Limiting (Stricter) ────────────────────────────────────
    location /api/auth/ {
        # Rate limiting ketat: 5 req/min dengan burst 5
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── Auth Register Rate Limit (Even Stricter) ─────────────────────────
    location /api/auth/register {
        # Sangat ketat: 3 req/hour per IP
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket Proxy (Socket.IO) ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout untuk WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Disable buffering untuk WebSocket
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── File Upload Endpoint ──────────────────────────────────────────────
    location /api/upload {
        client_max_body_size 10M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Health Check ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Static Cache Headers ─────────────────────────────────────────────
    # Fonts: cache 1 tahun (immutable)
    location ~* \.(woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Asset-Type "font";
        access_log off;
    }

    # Images: cache 30 hari
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|bmp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Asset-Type "image";
        access_log off;
    }

    # CSS & JS: cache 7 hari (versioned via build)
    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Asset-Type "script";
        access_log off;
    }

    # HTML: no cache (always fresh)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Block Sensitive Paths ─────────────────────────────────────────────
    # Block .env files
    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ \.env$ {
        deny all;
        return 404;
    }

    location ~ \.env\..+$ {
        deny all;
        return 404;
    }

    # Block .git directory
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Block node_modules
    location ~ /node_modules {
        deny all;
        return 404;
    }

    # Block .htaccess / .htpasswd
    location ~ /\.ht {
        deny all;
        return 404;
    }

    # Block hidden files
    location ~ /^\. {
        deny all;
        return 404;
    }

    # Block proc filesystem
    location ~ ^/(proc|sys|run|dev) {
        deny all;
        return 404;
    }

    # ─── Error Pages ───────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ─── Access/Error Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/rectobase-access.log;
    error_log /var/log/nginx/rectobase-error.log;
}

# ─── SSL Redirect Server (HTTP → HTTPS) ─────────────────────────────────────
# Opsional: bisa digabung dengan server block utama di atas
# server {
#     listen 80;
#     listen [::]:80;
#     server_name __DOMAIN__ www.__DOMAIN__;
#     return 301 https://$server_name$request_uri;
# }
