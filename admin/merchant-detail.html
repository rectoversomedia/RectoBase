        </div>

        <!-- Staff Tab -->
        <div class="tab-panel" id="tab-staff" role="tabpanel" data-tab-panel="merchant">

            </div>
          </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-panel" id="tab-settings" role="tabpanel" data-tab-panel="merchant">

            <h3 style="font-size:0.9375rem;font-weight:700;margin-bottom:20px;">Pengaturan Merchant</h3>

              <div class="form-group">

            <div class="form-row">

              <div class="form-group">

            </div>
            <div style="display:flex;gap:10px;margin-top:8px;">

<script src="assets/js/admin.js"></script>
<script>
(function () {
  if (!API.isAuthenticated()) { window.location.href = 'index.html'; return; }
  initSidebar();

  var merchantId = new URLSearchParams(window.location.search).get('id') || '1';
  var merchantData = null;
  var revenueChart = null;
  var revDetailChart = null;

  async function loadMerchant() {
    try {
      merchantData = await API.getMerchant(merchantId);
      renderMerchant();
    } catch (err) {
      Toast.error('Gagal memuat data', err.message);
      document.getElementById('merchant-name').textContent = 'Merchant tidak ditemukan';
    }
  }

  function renderMerchant() {
    var m = merchantData;
    document.getElementById('breadcrumb-name').textContent = m.name;
    document.getElementById('merchant-name').textContent = m.name;
    document.getElementById('merchant-avatar').textContent = m.name.charAt(0).toUpperCase();
    document.getElementById('merchant-owner').textContent = m.owner;
    document.getElementById('merchant-email').textContent = m.email;
    document.getElementById('merchant-city').textContent = m.city;
    document.getElementById('merchant-created').textContent = Format.date(m.created);

    var status = Format.status(m.status);
    document.getElementById('merchant-status-badge').innerHTML = '<span class="badge ' + status.cls + '">' + status.label + '</span>';
    var planCls = { starter: 'badge-starter', professional: 'badge-professional', enterprise: 'badge-enterprise' };
    document.getElementById('merchant-plan-badge').innerHTML = '<span class="badge ' + (planCls[m.plan] || '') + '">' + Format.plan(m.plan) + '</span>';

    document.getElementById('stat-outlets').textContent = m.outlets;
    document.getElementById('stat-staff').textContent = m.staff.length;
    document.getElementById('stat-orders').textContent = Format.number(m.orders.total);
    document.getElementById('stat-revenue').textContent = Format.currency(m.orders.value);
    document.getElementById('customer-count').textContent = Format.number(m.customers);

    // Update suspend button
    var suspendBtn = document.getElementById('action-suspend');
    if (suspendBtn) {
      if (m.status === 'suspended') {
        suspendBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg> Aktifkan Kembali';
      } else {
        suspendBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Suspkan';
      }
    }

    renderTopProducts(m.topProducts);
    renderRevenueChart(m);
    renderStaff(m.staff);
    renderOrders(m);
    renderRevenueTab(m);
    renderOutlets(m.outlets);

    document.getElementById('set-plan').value = m.plan;
    document.getElementById('set-status').value = m.status;
  }

  function renderTopProducts(products) {
    var container = document.getElementById('top-products');
    if (!container) return;
    var maxSold = Math.max(...products.map(function(p){ return p.sold; }));
    container.innerHTML = products.map(function(p) {
      var pct = Math.round((p.sold / maxSold) * 100);
      return '<div><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-weight:600;font-size:0.875rem;">' + p.name + '</span><span style="font-size:0.875rem;color:var(--color-text-secondary);">' + Format.number(p.sold) + ' terjual</span></div><div style="height:6px;background:var(--color-bg);border-radius:3px;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:var(--color-primary);border-radius:3px;"></div></div><div style="font-size:0.75rem;color:var(--color-text-muted);margin-top:2px;">' + Format.currency(p.revenue) + '</div></div>';
    }).join('');
  }

  function renderRevenueChart(m) {
    var ctx = document.getElementById('merchant-revenue-chart');
    if (!ctx) return;
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: m.revenueLabels,
        datasets: [{ label: 'Revenue', data: m.revenueByMonth.map(function(v){ return v/1000000; }), backgroundColor: 'rgba(22,163,74,0.7)', borderColor: '#16a34a', borderWidth: 1.5, borderRadius: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx){ return ' Rp ' + ctx.parsed.y.toFixed(1) + ' jt'; } } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 } }, border: { display: false } },
          y: { grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8', font: { size: 11 }, callback: function(v){ return 'Rp' + v + 'jt'; } }, border: { display: false, dash: [4,4] } }
        }
      }
    });
  }

  function renderStaff(staff) {
    var tbody = document.getElementById('staff-tbody');
    if (!tbody) return;
    tbody.innerHTML = staff.map(function(s) {
      return '<tr><td><div class="font-semibold">' + s.name + '</div></td><td class="text-muted" style="font-size:0.8125rem;">' + s.email + '</td><td><span class="badge badge-info">' + s.role + '</span></td><td><span class="badge badge-active">' + s.status + '</span></td><td class="text-muted" style="font-size:0.8125rem;">' + Format.date(s.lastLogin) + '</td><td><div class="table-actions"><button class="table-action-btn" title="Reset Password" onclick="resetStaffPassword(' + s.id + ',\'' + s.name + '\')">' + Icons.lock + '</button></div></td></tr>';
    }).join('');
  }

  function renderOrders(m) {
    var tbody = document.getElementById('orders-tbody');
    if (!tbody) return;
    var orders = [
      { id: 'ORD' + merchantId.padStart(4,'0') + '001', date: '2025-12-30', total: 285000, status: 'success' },
      { id: 'ORD' + merchantId.padStart(4,'0') + '002', date: '2025-12-29', total: 175000, status: 'success' },
      { id: 'ORD' + merchantId.padStart(4,'0') + '003', date: '2025-12-28', total: 95000, status: 'success' },
      { id: 'ORD' + merchantId.padStart(4,'0') + '004', date: '2025-12-27', total: 450000, status: 'success' },
      { id: 'ORD' + merchantId.padStart(4,'0') + '005', date: '2025-12-26', total: 320000, status: 'pending' },
    ];
    tbody.innerHTML = orders.map(function(o) {
      var st = Format.status(o.status);
      return '<tr><td><span class="mono" style="font-size:0.8125rem;">' + o.id + '</span></td><td>' + Format.date(o.date) + '</td><td class="font-semibold">' + Format.currency(o.total) + '</td><td><span class="badge ' + st.cls + '">' + st.label + '</span></td></tr>';
    }).join('');
  }

  function renderRevenueTab(m) {
    document.getElementById('rev-total').textContent = Format.currency(m.orders.value);
    var avg = Math.round(m.orders.value / 6);
    document.getElementById('rev-avg').textContent = Format.currency(avg) + '/bln';
    document.getElementById('rev-max').textContent = Format.currency(Math.max.apply(null, m.revenueByMonth));

    var ctx = document.getElementById('merchant-revenue-detail-chart');
    if (!ctx) return;
    if (revDetailChart) revDetailChart.destroy();
    revDetailChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: m.revenueLabels,
        datasets: [{ label: 'Revenue (jt)', data: m.revenueByMonth.map(function(v){ return v/1000000; }), borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.08)', borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: '#16a34a', fill: true, tension: 0.4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx){ return ' Rp ' + ctx.parsed.y.toFixed(1) + ' jt'; } } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } }, border: { display: false } },
          y: { grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8', font: { size: 12 }, callback: function(v){ return 'Rp'+v+'jt'; } }, border: { display: false, dash: [4,4] } }
        }
      }
    });
  }

  function renderOutlets(count) {
    var container = document.getElementById('outlets-list');
    if (!container) return;
    var outlets = [];
    for (var i = 1; i <= Math.min(count, 5); i++) {
      outlets.push({ name: 'Outlet ' + i, address: 'Jl. Contoh No. ' + i + ', Kota', status: 'active' });
    }
    container.innerHTML = outlets.map(function(o, idx) {
      return '<div style="padding:16px;border:1px solid var(--color-border);border-radius:var(--radius-lg);display:flex;align-items:center;gap:14px;"><div style="width:40px;height:40px;background:var(--color-primary-light);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--color-primary);font-weight:700;">' + (idx+1) + '</div><div style="flex:1;"><div style="font-weight:600;">' + o.name + '</div><div style="font-size:0.8125rem;color:var(--color-text-secondary);">' + o.address + '</div></div><span class="badge badge-active">Active</span><button class="table-action-btn danger" title="Hapus" onclick="removeOutlet(this)">' + Icons.trash + '</button></div>';
    }).join('');
  }

  window.toggleSuspend = async function() {
    if (!merchantData) return;
    if (merchantData.status === 'suspended') {
      await API.activateMerchant(merchantId);
      Toast.success('Diaktifkan', merchantData.name + ' berhasil diaktifkan.');
    } else {
      await API.suspendMerchant(merchantId);
      Toast.warning('Disuspkan', merchantData.name + ' berhasil disuspkan.');
    }
    loadMerchant();
  };

  window.openSettingsTab = function() {
    document.querySelectorAll('[data-tab-group="merchant"]').forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    document.querySelectorAll('.tab-panel[data-tab-panel="merchant"]').forEach(function(p){ p.classList.remove('active'); });
    var btn = document.getElementById('tab-btn-settings');
    if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }
    var panel = document.getElementById('tab-settings');
    if (panel) panel.classList.add('active');
  };

  window.saveMerchantSettings = async function() {
    var btn = document.getElementById('save-settings-btn');
    setLoading(btn, true);
    try {
      await API.updateMerchant(merchantId, {
        plan: document.getElementById('set-plan').value,
        status: document.getElementById('set-status').value,
      });
      Toast.success('Disimpan', 'Pengaturan berhasil disimpan.');
      loadMerchant();
    } catch (err) {
      Toast.error('Gagal', err.message);
    } finally {
      setLoading(btn, false);
    }
  };

  window.deleteThisMerchant = async function() {
    var ok = await confirm({ title: 'Hapus Merchant?', message: merchantData.name + ' dan semua datanya akan dihapus permanen.', confirmText: 'Ya, Hapus', danger: true });
    if (!ok) return;
    try {
      await API.deleteMerchant(merchantId);
      Toast.success('Dihapus', 'Merchant berhasil dihapus.');
      setTimeout(function(){ window.location.href = 'merchants.html'; }, 1000);
    } catch (err) {
      Toast.error('Gagal', err.message);
    }
  };

  window.resetStaffPassword = async function(id, name) {
    var ok = await confirm({ title: 'Reset Password?', message: 'Password untuk ' + name + ' akan di-reset dan email berisi link baru akan dikirim.', confirmText: 'Reset Password', danger: false });
    if (!ok) return;
    Toast.success('Email terkirim', 'Link reset password berhasil dikirim ke ' + name + '.');
  };

  window.openAddOutletModal = function() {
    Toast.info('Demo', 'Fitur tambah outlet belum terintegrasi dengan API.');
  };

  window.removeOutlet = async function(btn) {
    var ok = await confirm({ title: 'Hapus Outlet?', message: 'Outlet ini akan dihapus.', confirmText: 'Hapus', danger: true });
    if (ok) { btn.closest('div[style*="border:1px"]').remove(); Toast.success('Dihapus', 'Outlet berhasil dihapus.'); }
  };

  loadMerchant();
})();
<\/script>
</body>
</html>
